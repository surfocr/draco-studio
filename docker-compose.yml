version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "18082:18082"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/draco.db
      - STORAGE_PATH=/app/data/storage
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=18082
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    depends_on:
      - qdrant
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 18082 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:18082
    depends_on:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

volumes:
  data:
